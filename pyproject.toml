[build-system]
# hatchling 1.27 is the first release with PEP 639 `license` / `license-files` support.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "pyroflow"
dynamic = ["version"]
description = "Conversation-oriented Pyrogram extension with per-update listeners and multi-session coordination"
requires-python = ">=3.10"
authors = [{ name = "Abdullah", email = "aldheeb01@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "pyrogram",
    "telegram",
    "bot",
    "async",
    "conversation",
    "listener",
    "coordinator",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    "cachetools>=4.1.0",
    "kurigram>=2.2.24",
    "pytrove>=2.0.0,<3.0",
]


[project.urls]
"Homepage" = "https://github.com/eeeob/pyroflow"
"Source" = "https://github.com/eeeob/pyroflow"
"Issues" = "https://github.com/eeeob/pyroflow/issues"
"Releases" = "https://github.com/eeeob/pyroflow/releases"
"Changelog" = "https://github.com/eeeob/pyroflow/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = [
    "hatch<=1.16.5",
    "twine<=6.2.0",
]

redis = [
    "redis>=4.2.0",
]

test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "redis>=4.2.0",
    "fakeredis>=2.20",
    "lupa",
    "tomli; python_version < '3.11'",
]


[tool.hatch.build.targets.sdist]
# An allowlist, so a new top-level file never leaks into the sdist by accident.
# hatchling always adds README, LICENSE and pyproject.toml itself.
include = ["/pyroflow", "/tests"]

[tool.hatch.version]
path = "pyroflow/__meta__.py"


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["pyroflow"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
