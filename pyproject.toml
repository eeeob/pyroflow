[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "pyroflow"
dynamic = ["version"]
description = "Conversation-oriented Pyrogram extension with per-update listeners and multi-session coordination"
requires-python = ">=3.9"
authors = [{ name = "Abdullah", email = "aldheeb01@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }

keywords = [
    "pyrogram",
    "telegram",
    "bot",
    "async",
    "conversation",
    "listener",
    "coordinator",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    "cachetools", 
    "sortedcontainers==2.4.0", 
    "kurigram>=2.2.0", 
    "typing_extensions>=4.6.0; python_version < '3.10'",
]


[project.urls]
"Homepage" = "https://github.com/eeeob/pyroflow"
"Bug Tracker" = "https://github.com/eeeob/pyroflow/issues"


[project.optional-dependencies]
dev = [
    "hatch<=1.16.5",
    "twine<=6.2.0",
]

redis = [
    "redis>=4.2.0",
]

test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "redis>=4.2.0",
    "tomli; python_version < '3.11'",
]


[tool.hatch.build.targets.sdist]
exclude = [
    ".github/",
]

[tool.hatch.version]
path = "pyroflow/__meta__.py"


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["pyroflow"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
