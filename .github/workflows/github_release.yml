name: Upload release to GitHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Creating the release is the only write this workflow needs.
permissions:
  contents: write

jobs:
  build-n-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        # No cache on the release path: a poisoned cache would ship in the artifact.
        with:
          enable-cache: false

      - name: Build package
        run: make build

      - name: Create and upload release
        id: upload-release-asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Breaking changes and how to migrate: [CHANGELOG.md](https://github.com/eeeob/pyroflow/blob/${{ github.ref_name }}/CHANGELOG.md)."
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          files: dist/*
