name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version declared in pyproject.toml classifiers.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Import check (catches version-guard / missing-dependency breaks)
        run: python -c "import pyroflow; print('import OK on', __import__('sys').version)"

      - name: Run test suite
        run: python -m pytest -q
