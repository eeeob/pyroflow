name: Upload release to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Read-only by default; only the publish job gets the OIDC token.
permissions:
  contents: read

jobs:
  # The suite gates the release: nothing is built if it fails.
  tests:
    uses: ./.github/workflows/tests.yml

  build-n-publish:
    needs: tests
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no token is stored anywhere.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        # No cache on the release path: a poisoned cache would ship in the artifact.
        with:
          enable-cache: false

      - name: Build package
        run: make build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
